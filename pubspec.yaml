name: hotel_billing
description: Udupi Samruddhi hotel billing (Windows and Android, offline).
publish_to: 'none'
version: 10.0.0+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  excel: ^4.0.6
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_icon.png
    - assets/logo_full.png
    - assets/banner_dish.jpg
    - assets/dishes/
    - assets/fonts/
